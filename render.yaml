services:
  - type: web
    name: kisansetu-backend
    runtime: python
    buildCommand: cd kisansetu/backend && pip install -r requirements.txt
    startCommand: cd kisansetu/backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
